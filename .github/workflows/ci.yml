# NerveCenter CI — three jobs, each with a hard count floor.
#
#   python : pytest tests/ -m "not integration"  (expect >= 601 passed)
#   web    : npm ci && npm run build && playwright (expect >= 60 passed)
#   apple  : apple/scripts/test-apple.sh          (expect exactly 110, 0 failures)
#
# The apple job's count assertion doubles as the cold-cache guard: a fresh
# macOS runner has no .build, and test-apple.sh's touch + --build-tests +
# per-bundle count check makes the under-run trap impossible in CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (pytest, non-integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync environment
        run: uv sync --locked
      - name: Run non-integration suite
        run: uv run pytest tests/ -m "not integration" -q > /tmp/pytest.out 2>&1
      - name: Assert count floor (>= 601 passed, 0 failed)
        run: |
          cat /tmp/pytest.out
          passed=$(grep -oE '[0-9]+ passed' /tmp/pytest.out | grep -oE '[0-9]+' | tail -n1)
          echo "pytest passed=$passed (floor: 601)"
          test -n "$passed" && [ "$passed" -ge 601 ]
          ! grep -qE '[0-9]+ (failed|error)' /tmp/pytest.out

  web:
    name: web (build + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Playwright e2e (chromium)
        run: npx playwright test --reporter=line > /tmp/pw.out 2>&1
      - name: Assert count floor (>= 60 passed)
        run: |
          cat /tmp/pw.out
          passed=$(grep -oE '[0-9]+ passed' /tmp/pw.out | grep -oE '[0-9]+' | tail -n1)
          echo "playwright passed=$passed (floor: 60)"
          test -n "$passed" && [ "$passed" -ge 60 ]
          ! grep -E '[0-9]+ (failed|flaky)' /tmp/pw.out

  apple:
    name: apple (swift test, canonical command)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical Apple test command
        # test-apple.sh itself fails non-zero if any per-bundle count is
        # missing or off (NerveSharedTests 13 / NerveRelayTests 74 /
        # NerveAppsTests 23 = 110 total). No separate assertion step needed.
        run: bash apple/scripts/test-apple.sh
