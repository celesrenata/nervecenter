# opencode server config and the workspace clone list (NS-ADR-106).
# Models come from OmniRoute (in-cluster, namespace omniroute): `secure/*`
# combos only, with the no-memory headers (NS-ADR-108: "secure means it doesn't
# hit conversation history"). secure/* are OmniRoute-isolated (no memory) and
# capped at tier 1, so only the local models are reachable. opencode cannot run
# NerveCenter's route guard itself; the combo's server-side secure flag applies. No secret values here: the OmniRoute key is read
# from the env var OMNIROUTE_API_KEY (Secret opencode-server).
# nervecenter-infra (NS-ADR-120): opencode ACTS on owner-approved infra plans
# through NerveCenter's MCP tools; credentials stay in NerveCenter. Token from
# env NERVECENTER_MCP_TOKEN (Secret opencode-server key nervecenter_mcp_token).
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-config
  namespace: opencode
data:
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "autoupdate": false,
      "provider": {
        "omniroute": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "OmniRoute",
          "options": {
            "baseURL": "http://omniroute.omniroute.svc.cluster.local:20128/v1",
            "apiKey": "{env:OMNIROUTE_API_KEY}",
            "headers": {
              "x-omniroute-no-memory": "true",
              "x-omniroute-compression": "off"
            }
          },
          "models": {
            "secure/coder": {"name": "Secure coder (local vllm qwen3.8-27b, no memory)"},
            "secure/planner": {"name": "Secure planner (local llama-cpp deepseek-v41, no memory)"},
            "secure/reader": {"name": "Secure reader (local vllm granite-4.2-8b, no memory)"}
          }
        }
      },
      "mcp": {
        "servers": {
          "nervecenter-infra": {
            "type": "remote",
            "url": "http://api.nervecenter.svc.cluster.local:8000/api/mcp/infra",
            "headers": {"Authorization": "Bearer {env:NERVECENTER_MCP_TOKEN}"},
            "oauth": false
          }
        }
      },
      "model": "omniroute/secure/coder",
      "small_model": "omniroute/secure/reader",
      "permissions": [
        {"action": "shell", "resource": "git push *", "effect": "deny"},
        {"action": "shell", "resource": "git remote *", "effect": "deny"}
      ]
    }
  # One "name url" per line; cloned into /workspaces/<name> if missing.
  # Linux-buildable repos only (Mac-only work goes to the Mac runner).
  repos.txt: |
    nervcenter https://github.com/celesrenata/nervecenter.git
  clone.sh: |
    #!/bin/sh
    # Clone missing workspaces. Never pulls over local work and never pushes.
    set -eu
    mkdir -p /workspaces /data/home
    if [ -f /git/credentials ]; then
      git config --global credential.helper "store --file=/git/credentials"
    fi
    git config --global --add safe.directory '*'
    while read -r name url; do
      [ -z "${name:-}" ] && continue
      case "$name" in \#*) continue ;; esac
      if [ ! -d "/workspaces/$name/.git" ]; then
        git clone --filter=blob:none "$url" "/workspaces/$name" || echo "clone failed: $name"
      fi
    done < /config/repos.txt
