# ClusterIP for NerveCenter (api -> http://opencode.opencode.svc:4096) and a
# LAN LoadBalancer on the node IPs 10.1.1.12-15:4096 (k3s servicelb, house
# pattern) for the owner's Macs over WireGuard. No Ingress, no public host.
# Port 4096 was free on the node IPs on 2026-11-16.
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: opencode
spec:
  selector:
    app: opencode
  ports:
    - {name: http, port: 4096, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: opencode-lan
  namespace: opencode
spec:
  type: LoadBalancer
  # Keep the client source IP so the NetworkPolicy can match the WireGuard
  # subnet. MEASURE after deploy (see README): if the pod sees a node or svclb
  # address instead of 192.168.133.x, stop and ask the owner; do not widen.
  externalTrafficPolicy: Local
  selector:
    app: opencode
  ports:
    - {name: http, port: 4096, targetPort: http}
