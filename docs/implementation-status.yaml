    summary: >
      Phase 5 hygiene closeout (gaps4 §6 E1-E5) + Apple test-truth
      refresh. Recorded here because the workstream entries above were
      last touched at wave-1 integration (2026-09-29) and predate all of
      these changes.
    items:
      - id: E1
        title: FastAPI on_event -> lifespan migration (G-4.2)
        detail: >
          backend/api/wiring.py install_dependency_wiring now registers a
          single @asynccontextmanager lifespan on target.router.lifespan_context
          (startup: wire_dependencies, shutdown: teardown_dependencies)
          replacing the two @target.on_event("startup"/"shutdown")
          handlers; the deferral comment is gone.
          No FastAPI @app.on_event / @target.on_event decorator usage remains
          in backend/api (the only remaining "on_event" strings in backend/ are
          the connector's unrelated on_event callback parameter in
          backend/connectors/*, a different API, out of E1 scope).
          tests/backend/test_app_wiring.py 9/9 green with zero on_event
          deprecation warnings.
        evidence:
