# Kustomize base for NerveCenter (namespace: nervecenter).
#
# Secrets (nervecenter-env, harbor-pull) are intentionally NOT listed here:
# they are managed out-of-band by the operator (copy from an existing ns) and,
# for the app env secret, templated from secrets.yaml.example -> secrets.yaml
# (gitignored). The workloads reference them via envFrom / imagePullSecrets,
# which `kubectl apply` accepts without requiring the objects to be in this
# kustomization (they are resolved at pod runtime).
namespace: nervecenter

# Metadata-only label for every object (not selectors).
labels:
  - pairs:
      app.kubernetes.io/part-of: nervcenter
    includeSelectors: false

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-pvc.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - nats-deployment.yaml
  - nats-service.yaml
  - migrate-job.yaml
  # Object-store bootstrap Job (spec §14): creates the MinIO bucket the api
  # plane uses. Like the migrate Job it is re-applied on every upgrade (idempotent
  # `mc mb --ignore-existing`). Its NERVECENTER_OBJECT_STORE_* keys come from the
  # out-of-band `nervecenter-env` Secret (envFrom), resolved at pod runtime —
  # nothing object-store-related is in this kustomization.
  - object-store-bootstrap.yaml
  - api-deployment.yaml
  - api-service.yaml
  - mcp-deployment.yaml
  - mcp-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  # SSO (Keycloak) gate — mirrors the cluster's oauth2-proxy convention
  # (comfyui's `comfy-oauth` fronts the app; there is no traefik auth middleware
  # on this cluster). The `nervecenter-oauth` Secret is NOT listed here: its
  # `client-secret` must be created out-of-band from the Keycloak client
  # (see secrets.yaml.example and deployments/README.md "SSO (Keycloak)"),
  # never committed. The deployment's env refs resolve at pod runtime.
  - oauth-service.yaml
  - oauth-deployment.yaml
  - ingress.yaml
