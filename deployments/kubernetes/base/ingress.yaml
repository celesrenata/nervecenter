# Ingress for nervecenter.celestium.life (Traefik / cert-manager cluster-wide).
#
# SSO active via oauth2-proxy gate (Keycloak realm celestium, client nervecenter).
# Cluster convention: an **oauth2-proxy gate fronts the app** (see comfyui:
# `comfy-oauth` -> `comfy-gateway`). This cluster has NO traefik auth
# Middleware (its only 3 middlewares are prefix-strip / buffering), so SSO is
# enforced by pointing the Ingress at the `nervecenter-oauth` Service.
#
# Route map (2026-10-26):
#   /mcp/  -> mcp  (:8000)  DIRECT, OPEN  (programmatic MCP JSON-RPC API)
#   /      -> nervecenter-oauth (:4180)  GATED  (Keycloak SSO -> web nginx ->
#                                              SPA at / and /api/)
#
# The gate reverse-proxies authenticated traffic to the web nginx (:80), which
# in turn fans out in-cluster:
#   /        -> SPA static
#   /api/    -> api  (FastAPI service on :8000)
#
# Unauthenticated visitors are 302-redirected by the gate to the Keycloak
# authorization endpoint (realm `celestium` at sso.celestium.life); only
# authenticated users reach the app. See oauth-deployment.yaml /
# oauth-service.yaml and deployments/README.md "SSO (Keycloak)".
#
# /mcp/ is intentionally left OPEN (direct) for now: the SPA never calls it, and
# gating it end-to-end requires the web nginx to fan /mcp/ out to the mcp service
# (currently it proxies /mcp/ -> api, which 404s), i.e. a web image rebuild. That
# follow-up is documented in deployments/README.md.
#
# cert-manager picks up TLS automatically via the `cert-manager.io/cluster-issuer`
# annotation (issuer `celestium-le-production` is the cluster-wide standard for
# *.celestium.life). If you want a different issuer (e.g. internal CA), swap
# the annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nervcenter-celestium
  namespace: nervecenter
  labels:
    app: nervcenter
    app.kubernetes.io/name: ingress
  annotations:
    cert-manager.io/cluster-issuer: celestium-le-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nervecenter.celestium.life
      secretName: nervecenter-celestium-tls
  rules:
    - host: nervecenter.celestium.life
      http:
        paths:
          # OPEN: programmatic MCP JSON-RPC API, direct (no SSO) — see header note.
          - path: /mcp/
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  number: 8000
          # GATED: SSO gate -> web nginx -> (SPA | /api/). Everything else.
          # The `nervecenter` Keycloak client was recreated in the live
          # celestium realm via the Admin API on 2026-10-26 (never re-importing
          # the realm, per the SSO rollout doc) with a confidential
          # standard-flow + S256 PKCE configuration matching this deployment's
          # `--code-challenge-method=S256` args; its client-secret lives in the
          # out-of-band `nervecenter-oauth` Secret (see secrets.yaml.example).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nervecenter-oauth
                port:
                  number: 4180
