# NerveCenter API deployment. Image tag is set by the operator (deploy.sh
# patches it with the git short SHA before `kubectl apply -k`); the placeholder
# tag `latest` is the deploy.sh fallback when git is unavailable.
#
# envFrom: nervecenter-env (Secret — DB/NATS/OmniRoute URLs, NERVE_MOCK_INFER)
#          nervcenter-config (ConfigMap — APP_ENV, LOG_LEVEL, API_*).
# imagePullSecrets: harbor-pull (per-namespace copy; see deployments/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: nervecenter
  labels:
    app: nervcenter
    app.kubernetes.io/name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # The api never calls the Kubernetes API; no container needs a token.
      automountServiceAccountToken: false
      initContainers:
        # NerveShield static deep inspection (NS-ADR-086): parses PDF/OOXML/ZIP
        # structure, never executes. No env, no secrets, no SA token, read-only
        # root FS; only the shared UNIX socket volume is mounted.
        - name: inspector
          image: "registry.celestium.life/nervecenter/inspector:latest"
          imagePullPolicy: Always
          restartPolicy: Always
          env:
            - name: NERVE_INSPECTOR_SOCKET
              value: /run/inspector/inspector.sock
          resources:
            requests:
              memory: "64Mi"
              cpu: "0.05"
            limits:
              memory: "2Gi"
              cpu: "1"
          volumeMounts:
            - name: inspector-run
              mountPath: /run/inspector
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # NerveShield attachment scanner (NS-ADR-065): clamd as a native
        # sidecar, UNIX socket only (/run/clamav/clamd.sock in a pod-private
        # emptyDir), signatures read-only from the freshclam pod's volume (see
        # clamav.yaml). It waits for a database instead of crash-looping, so an
        # empty cache can never block or flap the api; until clamd answers the
        # scanner reports UNAVAILABLE and attachments stay INCOMPLETE, never
        # clean.
        - name: clamd
          image: "clamav/clamav:1.5.4_base@sha256:64ca916618842ba469ef38a501e6c2f42a68281c064c03749b0126c0fb085ce5"
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command:
            - sh
            - -c
            - |
              until [ -s /var/lib/clamav/main.cvd ] || [ -s /var/lib/clamav/main.cld ]; do
                echo "clamd: waiting for signature database"; sleep 15
              done
              exec clamd --foreground --config-file=/etc/clamav-nc/clamd.conf
          resources:
            # Full signature set ~1.2 GiB resident; ConcurrentDatabaseReload
            # briefly holds two copies during a SelfCheck reload.
            requests:
              memory: "1536Mi"
              cpu: "0.1"
            limits:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - name: clamav-db
              mountPath: /var/lib/clamav
              readOnly: true
            - name: clamav-config
              mountPath: /etc/clamav-nc
              readOnly: true
            - name: clamd-run
              mountPath: /run/clamav
            - name: clamd-tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: "registry.celestium.life/nervecenter/api:latest"
          # Always: Harbor tags are short git SHAs that can be republished in
          # place (arch fix on 2026-10-26), so a node-cached image under the
          # same tag must not be reused.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
            - name: infra-mcp
              containerPort: 8001
          envFrom:
            - secretRef:
                name: nervecenter-env
            - configMapRef:
                name: nervcenter-config
            # Object-store encryption keyring (out-of-band Secret; see
            # object-store-nfs.yaml). Losing it makes stored mail unreadable.
            - secretRef:
                name: nervecenter-object-key
            # Conversation-ledger HMAC key (NS-ADR-067; out-of-band Secret,
            # NERVE_MAIL_SECURITY_LEDGER_KEY). Losing it only resets the
            # ledger (derived data); without it the ledger is inert.
            - secretRef:
                name: nervecenter-ledger-key
                optional: true
          env:
            # Ask calendar actions: 'true' makes Ask propose an event and wait for
            # Confirm. 'false' makes Ask create the event at once and return an
            # undo token. The only switch between the two behaviours.
            - name: NERVE_ASK_CALENDAR_CONFIRM_FIRST
              value: "true"
            # Skill Hub read key for the agent runner (NS-ADR-099). Out-of-band
            # Secret, scopes read:skills + read:catalog. Optional: without it
            # agent runs simply have no skills.
            - name: NERVE_SKILLHUB_KEY
              valueFrom:
                secretKeyRef:
                  name: nervecenter-skillhub
                  key: key
                  optional: true
            # OmniRoute PRIVILEGED mode key (NS-ADR-110). Regular mode is
            # NERVE_OMNIROUTE_API_KEY (inference). Privileged = a key with the
            # `manage` scope, which OmniRoute requires for MCP from outside
            # localhost; used only for the Skill Hub read-only tools. Optional.
            - name: NERVE_OMNIROUTE_PRIVILEGED_KEY
              valueFrom:
                secretKeyRef:
                  name: nervecenter-omniroute-privileged
                  key: key
                  optional: true
            # Gremlin hub Bearer token for the agent tool layer (NS-ADR-113). NerveCenter
            # keeps its OWN copy (owner decision), copied from Secret
            # mcp-hub/mcp-hub-token key `token` without printing it. Optional: without it
            # hub tools answer "unconfigured". The hub is reached in-cluster at
            # NERVE_MCP_HUB_URL (default http://mcp-hub.mcp-hub.svc:8080).
            - name: NERVE_MCP_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nervecenter-mcp-hub
                  key: token
                  optional: true
            # OpenAI API key for the project-aware OpenAI engine (NS-ADR-104).
            # Out-of-band Secret; optional: without it the engine answers
            # "not configured".
            - name: NERVE_OPENAI_KEY
              valueFrom:
                secretKeyRef:
                  name: nervecenter-openai
                  key: key
                  optional: true
            # Bearer tokens for POST /api/mcp/projects, "client:token,client2:token2"
            # (each token >= 32 chars; the client name tags the notes it writes).
            # Optional: without it the endpoint answers 401 to everyone.
            - name: NERVE_MCP_PROJECTS_TOKENS
              valueFrom:
                secretKeyRef:
                  name: nervecenter-mcp-projects
                  key: tokens
                  optional: true
            # The OpenAI tunnel-client's token (NS-ADR-105), read from the same
            # owner-created Secret the tunnel-client uses, so the two always match.
            # Accepted as client "openai". Optional.
            - name: NERVE_MCP_TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nervecenter-openai-tunnel
                  key: mcp_token
                  optional: true
            # Internal service credential for the mcp pod (NS-ADR-122). Out-of-band
            # Secret nervecenter-internal-mcp, key `api-token`; the SAME value is
            # sent by the mcp pod as NERVE_MCP_API_TOKEN. The api accepts it only on
            # the paths in SERVICE_ROUTE_SCOPES["mcp"], never as a person.
            # DEPLOY TOGETHER with mcp bearer enforcement (mcp-deployment.yaml):
            # the api now refuses anonymous calls, and /mcp refuses anonymous callers.
            # Kubernetes expands $(VAR) from an earlier env entry. Optional: without
            # the Secret the token stays unexpanded, is ignored, and mcp calls get 401.
            - name: NERVE_INTERNAL_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nervecenter-internal-mcp
                  key: api-token
                  optional: true
            - name: NERVE_INTERNAL_SERVICE_TOKENS
              value: "mcp:$(NERVE_INTERNAL_MCP_TOKEN)"
            # Central opencode for coding handoffs (NS-ADR-106). The server lives in
            # namespace `opencode` (manifests: ~/sources/kube/opencode on the kube
            # host, mirrored in docs/central-opencode). api egress is not restricted
            # (NS-ADR-083), and the opencode NetworkPolicy admits only api pods
            # from this namespace plus the WireGuard subnet. Without the optional
            # Secret the executor stays off and central handoffs stay queued.
            # Short-lived kubeconfig / SSH key files live only in this memory volume (NS-ADR-120).
            - name: NERVE_INFRA_TMP
              value: /run/nerve-infra
            # Infra MCP for the central opencode, on its own port (NS-ADR-121).
            - name: NERVE_INFRA_MCP_PORT
              value: "8001"
            - name: NERVE_OPENCODE_URL
              value: http://opencode.opencode.svc.cluster.local:4096
            # Workbench phase gate (0 off, 1 catalogue, 2 editor+Sessions, 3 IDE).
            - name: WORKBENCH_PHASE
              value: "3"
            - name: WORKBENCH_IDE_ENABLED
              value: "true"
            - name: WORKBENCH_IDE_IMAGE
              value: registry.celestium.life/nervecenter/workbench-ide@sha256:b36ebb481d1e1811b5359e03a61bc8cefa003e3db7f5791f7e686db3d4217481
            - name: WORKBENCH_IDE_ALLOWED_ORIGINS
              value: https://nervecenter.celestium.life
            - name: WORKBENCH_IDE_TICKET_KEY
              valueFrom:
                secretKeyRef:
                  name: workbench-ide-ticket
                  key: key
            - name: NERVE_OPENCODE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nervecenter-opencode
                  key: password
                  optional: true
            # cmap pentest workload token (NS-ADR-125; out-of-band Secret, owner-run
            # steps in deployments/pentest/README.md). Optional: without it cmap
            # scans stay unconfigured. NERVE_CMAP_URL defaults to the in-cluster
            # Service http://cmap.nervecenter.svc:8000 (backend/pentest/cmap_client.py).
            - name: NERVE_CMAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nervecenter-cmap
                  key: token
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "0.25"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            # Encrypted durable object store (file:// + AES-256-GCM).
            - name: objects
              mountPath: /data/objects
            # clamd UNIX socket (NERVE_CLAMD_SOCKET in the ConfigMap).
            - name: clamd-run
              mountPath: /run/clamav
            # Static inspector socket (NS-ADR-086).
            - name: inspector-run
              mountPath: /run/inspector
            - name: infra-tmp
              mountPath: /run/nerve-infra
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: objects
          persistentVolumeClaim:
            claimName: nervecenter-objects
        - name: clamav-db
          persistentVolumeClaim:
            claimName: nervecenter-clamav
            readOnly: true
        - name: clamav-config
          configMap:
            name: clamav-config
        - name: clamd-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: clamd-tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: inspector-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: infra-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      imagePullSecrets:
        - name: harbor-pull
