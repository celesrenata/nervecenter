# NerveCenter non-secret configuration.
#
# The web container (nginx) reads API_UPSTREAM/API_PORT to proxy /api/ and /mcp/
# to the api service; the api container inherits them harmlessly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nervcenter-config
  namespace: nervecenter
  labels:
    app: nervcenter
    app.kubernetes.io/name: nervcenter-config
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  TZ: "UTC"
  # api listens on 8000 inside the pod (uvicorn entrypoint).
  API_PORT: "8000"
  # web (nginx) proxies to the api Service in this namespace.
  API_UPSTREAM: "api.nervecenter.svc"
  # mcp server proxies §45 tool calls to the §46 API service in-cluster.
  NERVE_MCP_API: "http://api:8000"
  # NOTE: the object store (§14) is NOT configured here. Its NERVECENTER_*
  # variables (NERVECENTER_OBJECT_STORE_URL / _BUCKET / _ACCESS_KEY /
  # _SECRET_KEY / _REGION / _SECURE) belong in the out-of-band
  # `nervecenter-env` Secret — see secrets.yaml.example. Until provisioned,
  # the store degrades honestly to "not configured" (surface on /api/health).
