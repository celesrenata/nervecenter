# NerveCenter non-secret configuration.
#
# The web container (nginx) reads API_UPSTREAM/API_PORT to proxy /api/ and /mcp/
# to the api service; the api container inherits them harmlessly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nervcenter-config
  namespace: nervecenter
  labels:
    app: nervcenter
    app.kubernetes.io/name: nervcenter-config
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  TZ: "UTC"
  # api listens on 8000 inside the pod (uvicorn entrypoint).
  API_PORT: "8000"
  # web (nginx) proxies to the api Service in this namespace.
  API_UPSTREAM: "api.nervecenter.svc"
  # mcp server proxies §45 tool calls to the §46 API service in-cluster.
  NERVE_MCP_API: "http://api:8000"
  # NerveShield mail security (SHADOW mode only): scans ingested mail locally and
  # records metadata-only verdicts. No network, no LLM, no provider writes, no
  # change to attention. Set to "0" (and roll api) to turn it off again.
  NERVE_MAIL_SECURITY_ENABLED: "1"
  # Assessments API scope mode (NS-ADR-025). "single_tenant": any authenticated
  # HUMAN access token may read metadata-only assessments for the ENABLED mail
  # connections (device tokens excluded; a token's own account_scopes claim can
  # only narrow). Remove this key or set "claim_only" (and roll api) to revert
  # to deny-by-default.
  NERVE_MAIL_SECURITY_API_SCOPE_MODE: "single_tenant"
  # NerveShield ops dashboard (Task 7.7): read-only ArcForge status probes
  # (/ready, /v1/models, /metrics only; never embeds or classifies), at most
  # once per 30 s and only when the dashboard is viewed. Literal private IPs
  # only, up to 4, comma-separated. Remove this key to report NOT_CONFIGURED.
  NERVE_MAIL_SECURITY_ARCFORGE_URL: "http://10.1.1.15:8100,http://10.1.1.12:8100"
  # NerveShield Task 7.8 REVIEW_GATED canary (owner opt-in, all accounts).
  # Mail-derived Today items / commitments are HELD until a verdict exists;
  # SAFE_TO_PROCESS / LOW_PRIORITY release with the exact original id;
  # REVIEW / RESTRICTED / INCOMPLETE stay review candidates. No provider mail
  # is changed. Scopes are listed explicitly so a new account never joins
  # silently. ROLLBACK: delete both keys and roll api. Items still HELD then
  # are no longer released automatically (the release pass only runs with
  # the gate ON) — see evidence/phase7-7.8-results.md for the one-off
  # release command. REVIEW_CANDIDATE items stay in the review queue.
  NERVE_MAIL_SECURITY_PROMOTION_GATE: "review_gated"
  NERVE_MAIL_SECURITY_PROMOTION_GATE_SCOPES: "conn:53b03939-bdf6-4313-a7e3-b91144c598d2,conn:fc4e3c57-2f5f-49b6-87e7-9f3e87fd813e"
  # NerveShield full-email capture (NS-ADR-064, G8 item 1, owner-approved).
  # New Gmail mail is also fetched with format=raw and the unmodified RFC822
  # bytes are stored as a separate encrypted object for the security plane
  # only (SHADOW; no model sees them). Set "0" (and roll api) to go back to
  # body-only; already-stored raw objects stay encrypted on the NAS.
  NERVE_MAIL_SECURITY_FULL_CAPTURE: "1"
  # NerveShield trusted receiver (NS-ADR-070): Gmail's own receiving server.
  # Only the TOPMOST Authentication-Results header is attested (Gmail
  # prepends it above everything the sender wrote); lower copies naming the
  # same server stay UNTRUSTED. Results become PROVIDER_REPORTED, never
  # INDEPENDENT. Remove this key to attest nothing again.
  NERVE_MAIL_SECURITY_TRUSTED_AUTHSERV_IDS: "mx.google.com"
  # NerveShield SHADOW semantic observer (NS-ADR-073, G8 item 3, owner "do
  # em"). Real mail excerpts (subject, <=4000 chars of text, link hosts,
  # attachment types, finding codes) go to the local Granite reader ONLY via
  # NerveCenter's Reader combo, route-guarded on every call (secure combo,
  # local leaves only). Proven before enabling: no OmniRoute memory write, no
  # body artifacts, no prompt logging on the Granite host. Stored output is
  # enum codes only. Remove this key to stop sending mail to any model.
  NERVE_MAIL_SECURITY_OBSERVER_SCOPES: "conn:53b03939-bdf6-4313-a7e3-b91144c598d2,conn:fc4e3c57-2f5f-49b6-87e7-9f3e87fd813e"
  # Observer prompt contract (NS-ADR-080): COMPACT_V2 = trusted sender/link
  # context, model reports facts, code decides PHISHING_SUSPECTED. Real mail
  # 37% -> 4.4% phishing labels; synthetic FP 19% -> 0%. Remove = compact@1.
  NERVE_MAIL_SECURITY_OBSERVER_CONTRACT: "COMPACT_V2"
  # NerveShield personal expectedness (NS-ADR-075, owner "sure"). Per-account
  # HMAC sender keys -> request-type counts only; scores each ask against the
  # sender's history (fixed population prior, abstains under 5 messages).
  # Only an UNEXPECTED high-impact ask adds an advisory review reason.
  # Remove this key to stop; seed_expectedness --forget erases learned counts.
  NERVE_MAIL_SECURITY_EXPECTEDNESS_SCOPES: "conn:53b03939-bdf6-4313-a7e3-b91144c598d2,conn:fc4e3c57-2f5f-49b6-87e7-9f3e87fd813e"
  # NerveShield attachment scanning (NS-ADR-065): the clamd sidecar's UNIX
  # socket. Remove this key to report attachments as NOT_RUN again.
  NERVE_CLAMD_SOCKET: "/run/clamav/clamd.sock"
  # NOTE: the object store (§14) is NOT configured here. Its NERVECENTER_*
  # variables (NERVECENTER_OBJECT_STORE_URL / _BUCKET / _ACCESS_KEY /
  # _SECRET_KEY / _REGION / _SECURE) belong in the out-of-band
  # `nervecenter-env` Secret — see secrets.yaml.example. Until provisioned,
  # the store degrades honestly to "not configured" (surface on /api/health).
