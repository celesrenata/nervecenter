# Namespace hardening (NS-ADR-083, owner "go ahead" 2026-11-13).
#
# INGRESS: default deny for every pod in `nervecenter`, then exactly the
# flows the app uses (verified from the Ingress, oauth2-proxy args, the web
# nginx.conf and NERVE_NATS_URL):
#   traefik (kube-system) -> nervecenter-oauth:4180, mcp:8000, and api:8000
#     (api only for the relay's exact-path ingress, relay-ingress.yaml)
#   nervecenter-oauth -> web:80
#   web, mcp -> api:8000
#   api, migration job, one-off db-snapshot pods -> postgres:5432
#   api -> nats:4222
# Kubelet probes come from the node and are allowed by k3s's policy
# controller. Owner tools run inside the api pod (kubectl exec), unaffected.
#
# EGRESS: locked only where a pod needs nothing outside the namespace
# (postgres, nats: DNS only; web: DNS + api). api, oauth and mcp keep egress
# (Gmail/Google APIs, SSO, OmniRoute, ArcForge); freshclam has its own policy.
#
# Rollback: `kubectl -n nervecenter delete networkpolicy -l nervecenter.policy=hardening`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels: {nervecenter.policy: hardening}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-edge
  labels: {nervecenter.policy: hardening}
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [nervecenter-oauth, mcp]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {protocol: TCP, port: 4180}
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oauth-to-web
  labels: {nervecenter.policy: hardening}
spec:
  podSelector:
    matchLabels: {app: web}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: nervecenter-oauth}
      ports:
        - {protocol: TCP, port: 80}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-mcp-to-api
  labels: {nervecenter.policy: hardening}
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [web, mcp]}
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-api-only
  labels: {nervecenter.policy: hardening}
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [api, migration, db-snapshot]}
      ports:
        - {protocol: TCP, port: 5432}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-api-only
  labels: {nervecenter.policy: hardening}
spec:
  podSelector:
    matchLabels: {app: nats}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: api}
      ports:
        - {protocol: TCP, port: 4222}
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-egress-api-only
  labels: {nervecenter.policy: hardening}
spec:
  podSelector:
    matchLabels: {app: web}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: api}
      ports:
        - {protocol: TCP, port: 8000}
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-api-relay
  labels: {nervecenter.policy: hardening}
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {protocol: TCP, port: 8000}
