# NOT ENABLED (pending owner approval, NS-ADR-106 gate B). Not in any kustomization.
#
# SSO-free exact paths for the Mac handoff agent (launchd, pull model):
#     POST /api/handoffs/device/claim
#     POST /api/handoffs/device/result
# Both check the paired relay device token themselves (X-Nerve-Device + Bearer,
# one generic 401, nothing read first) and cap the body at 64 KiB.
#
# To enable after approval: append these objects to base/relay-ingress.yaml
# (or list this file in base/kustomization.yaml) and deploy with deploy.sh.
# Verify: no token -> 401; GET, trailing slash, other paths -> SSO redirect;
# body over 64 KiB -> 413.
# Rollback: kubectl -n nervecenter delete ingress nervcenter-handoff
#   middleware handoff-body-limit handoff-rate-limit
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: handoff-body-limit
  labels:
    app: nervcenter
spec:
  buffering:
    maxRequestBodyBytes: 65536
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: handoff-rate-limit
  labels:
    app: nervcenter
spec:
  rateLimit:
    average: 2
    burst: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nervcenter-handoff
  namespace: nervecenter
  labels:
    app: nervcenter
    app.kubernetes.io/name: ingress-handoff
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: nervecenter-handoff-body-limit@kubernetescrd,nervecenter-handoff-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nervecenter.celestium.life
      secretName: nervecenter-celestium-tls
  rules:
    - host: nervecenter.celestium.life
      http:
        paths:
          - path: /api/handoffs/device/claim
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /api/handoffs/device/result
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 8000
