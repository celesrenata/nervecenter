[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nervcenter"
version = "0.0.1"
description = "NerveCenter: a local-first, event-driven personal intelligence core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NerveCenter" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "click>=8.1",
    "uvicorn>=0.27",
    # WebSocket upgrade support for the uvicorn server (spec §46
    # /api/events/ws): uvicorn needs `websockets` (or `wsproto`) to answer
    # 101; without it the handshake 404s as a plain HTTP GET.
    "websockets>=12.0",
    "httpx>=0.27",
    "structlog>=24.0",
    # Auth (S101: signed JWTs, HS256 + RS256 SSO via JWKS)
    "PyJWT[crypto]>=2.8",
    "cryptography>=42.0",
    # Event bus
    "nats-py>=2.9.0",
    # Persistence layer
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    # Observability (OpenTelemetry + Prometheus)
    "opentelemetry-sdk",
    "opentelemetry-exporter-prometheus",
    "prometheus-client",
    "tabulate>=0.9",
    "tenacity>=9.0",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "click>=8.1",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Event bus development
    "nats-py>=2.9.0",
    # Persistence development (sqlite driver for local / test databases)
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    "tabulate>=0.9",
]
ml = [
    # NerveShield 6.3 benchmark only; never installed in the service image
    # (Dockerfile.api runs `pip install .` without extras). Exact pins.
    "mlx==0.32.4",
    "mlx-lm==0.32.2",
    "numpy==2.4.6",
    "openvino==2026.4.0",
    "peft==0.21.2",
    "scikit-learn==1.9.1",
    "torch==2.15.0",
    "transformers==5.22.2",
]
inspector = [
    # NerveShield static deep inspection (NS-ADR-086): the analyzer sidecar
    # image (Dockerfile.inspector) and its tests only; never the api image.
    "pikepdf==10.18.1",
    "defusedxml==0.7.1",
]

[tool.setuptools.packages.find]
include = ["backend*", "schemas*", "mcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "deployments",
    "migrations",
    "synthetic-lab",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.pyright]
include = ["backend", "sdk/python", "schemas"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs external infrastructure (e.g. NERVE_TEST_POSTGRES_URL scratch Postgres); skipped when absent",
    "route_auth: exercises the real default-deny gate (the fake-person fixture is skipped)",
]
